<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Shield Outer -->
  <path d="M50 8 L85 22 V54 C85 72 50 92 50 92 C50 92 15 72 15 54 V22 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner Glow Ring -->
  <circle cx="50" cy="46" r="26" fill="#032a1e" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Gear Wheel / Tech Motif -->
  <g stroke="url(#cyanGrad)" stroke-width="2" fill="none" opacity="0.85">
    <circle cx="50" cy="46" r="15" />
    <line x1="50" y1="28" x2="50" y2="33" />
    <line x1="50" y1="59" x2="50" y2="64" />
    <line x1="32" y1="46" x2="37" y2="46" />
    <line x1="63" y1="46" x2="68" y2="46" />
  </g>

  <!-- Torch / Flame of Wisdom -->
  <path d="M50 34 C46 39 45 44 48 48 C49 46 51 45 52 42 C54 45 55 47 54 50 C57 46 56 39 50 34 Z" fill="url(#goldGrad)" />
  
  <!-- Open Book of Knowledge -->
  <path d="M40 57 Q45 54 50 56 Q55 54 60 57 L60 62 Q55 59 50 61 Q45 59 40 62 Z" fill="#ffffff" />
  <path d="M50 56 L50 61" stroke="#047857" stroke-width="1" />

  <!-- Stars of Excellence -->
  <polygon points="50,17 51.5,21 55,21 52,23 53.5,27 50,24.5 46.5,27 48,23 45,21 48.5,21" fill="url(#goldGrad)" />
  <circle cx="28" cy="52" r="2" fill="#38bdf8" />
  <circle cx="72" cy="52" r="2" fill="#38bdf8" />
  
  <!-- Bottom Text Emblem Ribbon -->
  <path d="M30 78 Q50 83 70 78" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>